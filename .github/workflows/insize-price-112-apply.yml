# Owner-authorized INSIZE +12% base_price APPLY on karzar-vps (CR-011 live).
#
# SAFETY:
# - Proves host/container/volume/DB identity before any write
# - Current live priced INSIZE cohort is the mutation authority (no fixed count)
# - Idempotency gate on exact change reason before APPLY
# - Rehearsal = exact mutate path then ROLLBACK
# - APPLY = single transaction, allowlist + stale-price guards, base_price ONLY
# - No deploy, no Hesabfa, no other brands
#
# Triggers on push to this agent branch (self-hosted runner has live compose).
# Does not use actions/checkout (known hang on this runner). Script is fetched
# via GitHub API at GITHUB_SHA. Artifacts committed back to this branch.
name: INSIZE Price +12% APPLY

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "rehearse-only or apply"
        required: true
        default: "rehearse-only"
        type: choice
        options:
          - rehearse-only
          - apply
  push:
    branches:
      - cursor/insize-price-112-6786
    paths:
      - ".github/workflows/insize-price-112-apply.yml"
      - "scripts/ops/insize_price_112_apply.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: insize-price-112-apply
  cancel-in-progress: false

jobs:
  insize-price-112:
    name: INSIZE +12% guarded APPLY
    runs-on: [self-hosted, karzar-vps]
    timeout-minutes: 60
    steps:
      - name: Host + container identity (read-only probe)
        id: identity
        run: |
          set -euo pipefail
          HOST="$(hostname)"
          echo "hostname=${HOST}"
          test "${HOST}" = "srv5944957438"
          docker inspect lathe_postgres --format '{{.Name}}' | grep -q lathe_postgres
          DB_NAME="$(docker exec lathe_postgres printenv POSTGRES_DB || true)"
          echo "postgres_db=${DB_NAME}"
          test "${DB_NAME}" = "karzar_staging"
          VOL="$(docker inspect lathe_postgres --format '{{range .Mounts}}{{println .Name}}{{end}}' | tr '\n' ' ')"
          echo "volumes=${VOL}"
          echo "${VOL}" | grep -q 'karzar_postgres_data\|postgres_data'
          APP_ENV="$(docker exec lathe_api printenv APP_ENV || true)"
          PLANE="$(docker exec lathe_api printenv KARZAR_DATA_PLANE || true)"
          echo "APP_ENV=${APP_ENV}"
          echo "KARZAR_DATA_PLANE=${PLANE}"
          if [ "${PLANE}" = "catalog_staging" ]; then
            echo "FATAL: KARZAR_DATA_PLANE=catalog_staging — aborting" >&2
            exit 2
          fi
          # Catalog-staging must not be confused with live.
          if docker ps --format '{{.Names}}' | grep -q 'karzar_catalog_staging'; then
            echo "NOTE: catalog_staging containers visible; APPLY still targets lathe_postgres only"
          fi
          echo "HOST_PROOF=${HOST}" >> "$GITHUB_ENV"
          echo "CONTAINER_PROOF=lathe_postgres" >> "$GITHUB_ENV"
          echo "VOLUME_PROOF=${VOL}" >> "$GITHUB_ENV"

      - name: Fetch APPLY script for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          DEST="/tmp/karzar-insize-price-112"
          mkdir -p "$DEST"
          SCRIPT="$DEST/insize_price_112_apply.py"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/ops/insize_price_112_apply.py?ref=${SHA}" \
            -o "$SCRIPT"
          test -s "$SCRIPT"
          head -n 8 "$SCRIPT"
          wc -l "$SCRIPT"
          sha256sum "$SCRIPT"

      - name: Run guarded INSIZE +12% job inside lathe_api
        run: |
          set -euo pipefail
          MODE="${{ github.event.inputs.mode || 'apply' }}"
          # Push trigger = Owner-authorized emergency APPLY for this branch only.
          if [ "${{ github.event_name }}" = "push" ]; then
            MODE="apply"
          fi
          echo "MODE=${MODE}"

          OUT_HOST="/tmp/karzar-insize-price-112/out-${GITHUB_SHA}"
          rm -rf "$OUT_HOST"
          mkdir -p "$OUT_HOST"

          docker cp /tmp/karzar-insize-price-112/insize_price_112_apply.py \
            lathe_api:/tmp/insize_price_112_apply.py

          # Clean prior container out-dir to avoid stale artifacts.
          docker exec lathe_api rm -rf /tmp/karzar-insize-price-112-out
          docker exec lathe_api mkdir -p /tmp/karzar-insize-price-112-out

          APPLY_ARGS=(--out-dir /tmp/karzar-insize-price-112-out)
          if [ "$MODE" = "apply" ]; then
            # Owner authorization for THIS scoped INSIZE base_price job is the
            # human prompt that created this branch. Category B flags required.
            APPLY_ARGS+=(--apply --confirm-owner-authorized-insize-price-112)
          fi

          set +e
          docker exec \
            -e KARZAR_HOST_PROOF="${HOST_PROOF}" \
            -e KARZAR_CONTAINER_PROOF="${CONTAINER_PROOF}" \
            -e KARZAR_VOLUME_PROOF="${VOLUME_PROOF}" \
            -e KARZAR_GIT_SHA="${GITHUB_SHA}" \
            -e KARZAR_ALLOW_PRODUCTION_WRITE=1 \
            -e KARZAR_INGESTION_CATEGORY=B \
            lathe_api \
            python /tmp/insize_price_112_apply.py "${APPLY_ARGS[@]}"
          RC=$?
          set -e
          echo "SCRIPT_EXIT=${RC}"

          docker cp lathe_api:/tmp/karzar-insize-price-112-out/. "$OUT_HOST/" || true
          ls -la "$OUT_HOST" || true

          if [ -f "$OUT_HOST/FINAL_REPORT.json" ]; then
            # Prefer container python — host python3 is not guaranteed on this runner.
            docker run --rm -v "$OUT_HOST:/out:ro" python:3.12-slim \
              python -c '
import json
from pathlib import Path
p = Path("/out/FINAL_REPORT.json")
report = json.loads(p.read_text())
print("---FINAL_REPORT_JSON_BEGIN---")
print(json.dumps(report, indent=2, ensure_ascii=False)[:30000])
print("---FINAL_REPORT_JSON_END---")
print(report.get("FINAL_LINE", "MISSING_FINAL_LINE"))
print("STATUS=" + str(report.get("STATUS")))
' || {
              echo "WARN: pretty-print via docker python failed; dumping raw head"
              head -c 20000 "$OUT_HOST/FINAL_REPORT.json" || true
              echo
            }
          else
            echo "FINAL_REPORT.json missing"
          fi

          echo "OUT_HOST=${OUT_HOST}" >> "$GITHUB_ENV"
          echo "SCRIPT_EXIT=${RC}" >> "$GITHUB_ENV"

          # Propagate script failure after artifact capture.
          if [ "$RC" -ne 0 ]; then
            exit "$RC"
          fi
          # Require exact success line when MODE=apply
          if [ "$MODE" = "apply" ]; then
            if grep -q 'INSIZE_PRICE_112_APPLY_OK' "$OUT_HOST/FINAL_REPORT.md"; then
              echo "APPLY_OK_CONFIRMED"
            elif grep -q 'INSIZE_PRICE_112_ALREADY_APPLIED_VERIFIED' "$OUT_HOST/FINAL_REPORT.md"; then
              echo "ALREADY_APPLIED_CONFIRMED"
            else
              echo "FATAL: expected APPLY_OK or ALREADY_APPLIED in FINAL_REPORT.md" >&2
              exit 1
            fi
          fi

      - name: Commit APPLY artifacts to branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${OUT_HOST:-}"
          test -d "$OUT_HOST"
          WORK="/tmp/karzar-insize-price-112/git-${GITHUB_SHA}"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD
          mkdir -p audit/insize-price-112
          # Copy non-secret operational artifacts (prices already public via API).
          cp -f "$OUT_HOST"/FINAL_REPORT.json audit/insize-price-112/ || true
          cp -f "$OUT_HOST"/FINAL_REPORT.md audit/insize-price-112/ || true
          cp -f "$OUT_HOST"/IDENTITY_PROBE.json audit/insize-price-112/ || true
          cp -f "$OUT_HOST"/VERIFY_REPORT.json audit/insize-price-112/ || true
          cp -f "$OUT_HOST"/INSIZE_PRICE_112_MANIFEST_*.csv audit/insize-price-112/ 2>/dev/null || true
          cp -f "$OUT_HOST"/INSIZE_PRICE_112_MANIFEST_*.json audit/insize-price-112/ 2>/dev/null || true
          cp -f "$OUT_HOST"/INSIZE_PRICE_112_RECOVERY_PREWRITE_*.csv audit/insize-price-112/ 2>/dev/null || true
          cp -f "$OUT_HOST"/INSIZE_PRICE_112_ROLLBACK_*.sql audit/insize-price-112/ 2>/dev/null || true
          cp -f "$OUT_HOST"/INSIZE_PRICE_112_FINGERPRINTS_*.json audit/insize-price-112/ 2>/dev/null || true
          # Preserve identity probe under stable verify name as well.
          if [ -f audit/insize-price-112/IDENTITY_PROBE.json ]; then
            cp -f audit/insize-price-112/IDENTITY_PROBE.json \
              audit/insize-price-112/VERIFY_IDENTITY_PROBE.json
          fi
          git add audit/insize-price-112
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git -c user.name="karzar-vps-insize-price-112" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(ops): INSIZE +12% price APPLY artifacts $(date -u +%Y-%m-%dT%H%MZ)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "ARTIFACTS_COMMITTED=YES"
