name: CI Full Regression

# Nightly + manual FULL tier (classifier --force-full). Does not replace required PR checks.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: ci-full-regression-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backend-full:
    name: backend-full
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: AODS (all retained gates)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pip install -r requirements.txt
          python3 aods/tools/aods_validate.py
      - run: bash scripts/ci/start_integration_services.sh
      - run: |
          pip install -r requirements-dev.txt
          pip install -r services/gsc_mcp/requirements.txt
      - name: Migrate + pytest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: karzar_ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          ADMIN_STEP_UP_PIN: 93827461
          DEBUG: "true"
          ENABLE_API_DOCS: "false"
          USE_POSTGRES_TESTS: "1"
          ALLOW_PUBLIC_REGISTER: "true"
          OTP_DEV_ECHO: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          alembic upgrade head
          pytest --maxfail=1 --disable-warnings --cov=app --cov-report=term-missing --cov-fail-under=68
      - if: always()
        run: docker rm -f ci-postgres ci-redis >/dev/null 2>&1 || true

  frontend-full:
    name: frontend-full
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - app: Storefront
            e2e: true
          - app: admin-panel
            e2e: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/${{ matrix.app }}/package-lock.json
      - name: Unit checks
        run: |
          set -euo pipefail
          cd "frontend/${{ matrix.app }}"
          npm ci
          npx tsc --noEmit
          npm run lint
          npm test
      - name: Storefront e2e
        if: matrix.e2e
        run: |
          set -euo pipefail
          cd frontend/Storefront
          npx playwright install --with-deps chromium
          npm run test:e2e
          npm run test:http-contract
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
          CI: "true"
