# Read-only Production taxonomy Phase 0B census on karzar-vps.
# SAFETY: BEGIN READ ONLY only. No INSERT/UPDATE/DELETE/restart/deploy.
#
# Pattern mirrors product-status-audit-readonly (self-hosted runner; no
# actions/checkout hang; Actions blob upload TLS fails on this VPS so results
# are committed back to audit/taxonomy-phase0b/ on this diagnostic branch).
name: Taxonomy Phase 0B DB Census Read-only

on:
  workflow_dispatch:
  push:
    branches:
      - cursor/taxonomy-phase0b-db-census-a062
    paths:
      - ".github/workflows/taxonomy-phase0b-db-census-readonly.yml"
      - "scripts/audit_taxonomy_phase0b_production_readonly.py"

permissions:
  contents: write

concurrency:
  group: taxonomy-phase0b-db-census-readonly
  cancel-in-progress: true

jobs:
  census:
    name: Production taxonomy census (read-only)
    runs-on: [self-hosted, karzar-vps]
    timeout-minutes: 45
    steps:
      - name: Host + container identity (read-only)
        id: identity
        run: |
          set -euo pipefail
          HOST="$(hostname)"
          echo "hostname=${HOST}"
          test "${HOST}" = "srv5944957438"
          docker inspect lathe_postgres --format '{{.Name}}' | grep -q lathe_postgres
          DB_NAME="$(docker exec lathe_postgres printenv POSTGRES_DB || true)"
          echo "postgres_db=${DB_NAME}"
          test "${DB_NAME}" = "karzar_staging"
          VOL="$(docker inspect lathe_postgres --format '{{range .Mounts}}{{println .Name}}{{end}}' | tr '\n' ' ')"
          echo "volumes=${VOL}"
          echo "${VOL}" | grep -q 'karzar_postgres_data\|postgres_data'
          APP_ENV="$(docker exec lathe_api printenv APP_ENV || true)"
          PLANE="$(docker exec lathe_api printenv KARZAR_DATA_PLANE || true)"
          echo "APP_ENV=${APP_ENV}"
          echo "KARZAR_DATA_PLANE=${PLANE}"
          # Public API identity cross-check (no secrets)
          curl -sS --max-time 10 https://api.karzartools.com/health || true
          echo
          echo "HOST_PROOF=${HOST}" >> "$GITHUB_ENV"
          echo "CONTAINER_PROOF=lathe_postgres" >> "$GITHUB_ENV"
          echo "VOLUME_PROOF=${VOL}" >> "$GITHUB_ENV"

      - name: Fetch census script for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${GITHUB_SHA}"
          DEST="/tmp/karzar-taxonomy-phase0b"
          mkdir -p "$DEST"
          SCRIPT="$DEST/audit_taxonomy_phase0b_production_readonly.py"
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/scripts/audit_taxonomy_phase0b_production_readonly.py?ref=${SHA}" \
            -o "$SCRIPT"
          test -s "$SCRIPT"
          head -n 8 "$SCRIPT"
          wc -l "$SCRIPT"

      - name: Run read-only taxonomy census inside lathe_api
        run: |
          set -euo pipefail
          OUT_HOST="/tmp/karzar-taxonomy-phase0b/out-${GITHUB_SHA}"
          rm -rf "$OUT_HOST"
          mkdir -p "$OUT_HOST"
          docker cp /tmp/karzar-taxonomy-phase0b/audit_taxonomy_phase0b_production_readonly.py \
            lathe_api:/tmp/audit_taxonomy_phase0b_production_readonly.py
          docker exec \
            -e KARZAR_HOST_PROOF="${HOST_PROOF}" \
            -e KARZAR_CONTAINER_PROOF="${CONTAINER_PROOF}" \
            -e KARZAR_VOLUME_PROOF="${VOLUME_PROOF}" \
            lathe_api \
            python /tmp/audit_taxonomy_phase0b_production_readonly.py \
              --out-dir /tmp/karzar-taxonomy-phase0b-out
          docker cp lathe_api:/tmp/karzar-taxonomy-phase0b-out/. "$OUT_HOST/"
          ls -la "$OUT_HOST"
          python3 - <<PY
          import json, pathlib
          d = pathlib.Path("${OUT_HOST}")
          ident = json.loads((d/"IDENTITY_PROBE.json").read_text())
          print("IDENTITY_OK", ident.get("ok"), ident.get("errors"))
          assert ident.get("ok") is True, ident
          assert str(ident["identity"].get("transaction_read_only","")).lower() in {"on","true"}
          summary = json.loads((d/"SUMMARY.json").read_text())
          g = summary["global"]
          print("LIVE", g["counts"].get("live"), "VISIBLE", g["counts"].get("visible"))
          print("CATEGORIES", g["category_structure"]["total"])
          print("PT_ASSIGNED", g["product_type"]["assigned_live"])
          print("KT_NODES", g["knowledge_taxonomy"]["nodes"])
          assert g["production_identity_proven"] is True
          assert g["read_only_proven"] is True
          print("---SUMMARY_COUNTS_BEGIN---")
          print(json.dumps({
            "live": g["counts"].get("live"),
            "visible": g["counts"].get("visible"),
            "sellable": g["counts"].get("sellable"),
            "categories": g["category_structure"]["total"],
            "l1": g["category_structure"]["l1"],
            "pt_coverage_pct": g["product_type"]["coverage_pct_live"],
            "kt_nodes": g["knowledge_taxonomy"]["nodes"],
            "hesabfa_populated": g["hesabfa"]["codes_populated"],
            "recon_all_match": all(r["match"] for r in summary["reconciliation"]),
          }, indent=2))
          print("---SUMMARY_COUNTS_END---")
          PY
          echo "OUT_HOST=${OUT_HOST}" >> "$GITHUB_ENV"

      - name: Commit census artifacts to diagnostic branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "${OUT_HOST:-}"
          test -d "$OUT_HOST"
          WORK="/tmp/karzar-taxonomy-phase0b/git-${GITHUB_SHA}"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          cd "$WORK"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_REF_NAME}"
          git checkout -q -B "${GITHUB_REF_NAME}" FETCH_HEAD
          mkdir -p audit/taxonomy-phase0b
          # Copy census artifacts only (no credentials by construction)
          cp -f "$OUT_HOST"/* audit/taxonomy-phase0b/
          # Drop oversized intermediate if any — keep required set
          git add audit/taxonomy-phase0b/
          if git diff --cached --quiet; then
            echo "No artifact changes to commit"
            exit 0
          fi
          git -c user.name="karzar-vps-readonly-audit" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore(audit): Taxonomy Phase 0B Production DB census (read-only)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "ARTIFACTS_COMMITTED=YES"
