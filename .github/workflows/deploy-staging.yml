name: Deploy Staging

# Staging = live VPS serving karzartools.com (single host until prod is split).
# CR-011 Option B (2026-07-30): NO push-to-main auto-deploy — human must
# Actions → Deploy Staging → Run workflow (workflow_dispatch) on `main`.
# Pattern: checkout on GitHub-hosted (VPS often gets 504 from github.com), then
# artifact → self-hosted runner for local rsync/rebuild. Never runs on fork PRs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy-freeze:
    name: Deployment freeze gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch and deployment freeze
        env:
          DEPLOY_FREEZE: ${{ vars.KARZAR_DEPLOY_FREEZE }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploys are allowed only from main (got $DISPATCH_REF)."
            exit 1
          fi
          if [[ "${DEPLOY_FREEZE:-}" == "true" ]]; then
            echo "::error::Deployments are frozen by KARZAR_DEPLOY_FREEZE. Owner must document the incident/change before unfreezing."
            exit 1
          fi

  package:
    name: Package sources
    needs: deploy-freeze
    runs-on: ubuntu-latest
    # Same-repo only (never trust fork workflows on self-hosted)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-src-${{ github.sha }}
          path: |
            .
            !.git
            !.github
            !**/.venv
            !**/venv
            !**/node_modules
            !**/.next
            !**/__pycache__
            !**/.pytest_cache
            !**/.mypy_cache
            !**/.ruff_cache
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Sync + rebuild staging
    needs: package
    runs-on: [self-hosted, karzar-vps]
    environment: staging
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    env:
      # Prefer A records. This VPS historically black-holes IPv6 to GitHub/Azure
      # blob endpoints (download-artifact then dies after 5 retries; job logs
      # never land in Azure either).
      NODE_OPTIONS: --dns-result-order=ipv4first
    steps:
      - name: Probe artifact endpoints (read-only)
        continue-on-error: true
        run: |
          set +e
          echo "probe_start=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for host in api.github.com results.actions.githubusercontent.com github.com; do
            echo "HOST=${host}"
            getent ahostsv4 "$host" 2>/dev/null | awk '{print " A",$1}' | sort -u | head -3
            getent ahostsv6 "$host" 2>/dev/null | awk '{print " AAAA",$1}' | sort -u | head -3
            curl -4 -sS -o /dev/null -m 10 -w " ipv4 http=%{http_code} time=%{time_total} ip=%{remote_ip}\n" "https://${host}/" || echo " ipv4 FAIL"
            curl -6 -sS -o /dev/null -m 4 -w " ipv6 http=%{http_code} time=%{time_total} ip=%{remote_ip}\n" "https://${host}/" || echo " ipv6 FAIL"
          done

      - name: Download deploy artifact
        id: artifact-download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: staging-src-${{ github.sha }}
          path: ${{ runner.temp }}/staging-src

      - name: Download deploy artifact over IPv4 (fallback)
        if: steps.artifact-download.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: staging-src-${{ github.sha }}
          DEST: ${{ runner.temp }}/staging-src
        run: |
          set -euo pipefail
          echo "download-artifact@v4 failed; retrying via api.github.com over IPv4"
          mkdir -p "$DEST"
          ZIP="${RUNNER_TEMP}/staging-src-artifact.zip"
          LIST_JSON="$(curl -4 -fsS --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          AID="$(printf '%s' "$LIST_JSON" | python3 -c "import json,os,sys; name=os.environ['ARTIFACT_NAME']; data=json.loads(sys.stdin.read()); ids=[a.get('id') for a in (data.get('artifacts') or []) if a.get('name')==name and not a.get('expired')]; raise SystemExit('artifact_not_found:'+name) if not ids else print(ids[0])")"
          echo "artifact_id=${AID}"
          curl -4 -fL --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$ZIP" \
            -w "artifact_http=%{http_code} time=%{time_total} ip=%{remote_ip} bytes=%{size_download}\n" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip"
          ZIP="$ZIP" DEST="$DEST" python3 -c "import os,zipfile,pathlib; z,d=os.environ['ZIP'],os.environ['DEST']; pathlib.Path(d).mkdir(parents=True, exist_ok=True); zf=zipfile.ZipFile(z); names=zf.namelist(); zf.extractall(d); zf.close(); print('extracted_files=%d' % len(names))"
          rm -f "$ZIP"

      - name: Assert deploy sources present
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/staging-src"
          test -d "$SRC"
          test -n "$(ls -A "$SRC")"
          echo "handoff_ok files=$(find "$SRC" -type f | wc -l)"

      - name: Sync backend → /opt/karzar/Karzar
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/staging-src"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.env' \
            --exclude '.deploy-secrets' \
            --exclude '.env.staging.generated' \
            --exclude 'backups/' \
            --exclude 'data/uploads/' \
            --exclude 'logs/' \
            --exclude '*.pyc' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude 'actions-runner/' \
            "$SRC"/ /opt/karzar/Karzar/
          # rsync --exclude 'frontend/' preserves a stale tree; remove it explicitly
          rm -rf /opt/karzar/Karzar/frontend

      - name: Sync frontend → /opt/karzar/frontend
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/staging-src"
          rsync -a --delete \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env*.local' \
            "$SRC"/frontend/ /opt/karzar/frontend/

      - name: Rebuild backend + frontend
        run: |
          set -euo pipefail
          cd /opt/karzar/Karzar
          chmod +x deploy/staging/scripts/*.sh || true
          chmod +x scripts/backup_db.sh scripts/backup_uploads.sh scripts/backup_offsite_sync.sh
          bash deploy/staging/scripts/deploy-backend.sh

          export FRONTEND_ROOT=/opt/karzar/frontend
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://api.karzartools.com/api/v1}"
          export NEXT_PUBLIC_GA_MEASUREMENT_ID="${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-NT8ZT3G6HC}"
          if [[ -z "${ADMIN_SESSION_SECRET:-}" ]]; then
            for f in /opt/karzar/.deploy-secrets /opt/karzar/Karzar/.env; do
              if [[ -f "$f" ]] && grep -q '^ADMIN_SESSION_SECRET=' "$f"; then
                ADMIN_SESSION_SECRET="$(grep '^ADMIN_SESSION_SECRET=' "$f" | tail -1 | cut -d= -f2-)"
                break
              fi
            done
          fi
          if [[ -z "${ADMIN_SESSION_SECRET:-}" || "${#ADMIN_SESSION_SECRET}" -lt 32 ]]; then
            echo "ADMIN_SESSION_SECRET missing on server (.deploy-secrets / .env)" >&2
            exit 1
          fi
          export ADMIN_SESSION_SECRET
          bash deploy/staging/scripts/deploy-frontend.sh

          # OPS-20: hard smoke gate — admin must not soft-fail.
          API_BASE=http://127.0.0.1:8000 \
          SHOP_BASE=http://127.0.0.1:3000 \
          ADMIN_BASE=http://127.0.0.1:3001 \
            bash deploy/staging/scripts/smoke-staging.sh

          # SEO-003: Category B deploy-time CMS publish (ADR-012 / CR-004 residual).
          # Not Category A enrichment — articles.json is Git SoT; live host is destination.
          export FRONTEND_ROOT="${FRONTEND_ROOT:-/opt/karzar/frontend}"
          export KARZAR_API_BASE="${KARZAR_API_BASE:-https://api.karzartools.com/api/v1}"
          export KARZAR_ALLOW_PRODUCTION_WRITE=1
          export KARZAR_INGESTION_CATEGORY=B
          # Creds live in preserved server .env / .deploy-secrets (rsync-excluded).
          set -a
          # shellcheck disable=SC1091
          [[ -f /opt/karzar/.deploy-secrets ]] && source /opt/karzar/.deploy-secrets
          # shellcheck disable=SC1091
          [[ -f /opt/karzar/Karzar/.env ]] && source /opt/karzar/Karzar/.env
          set +a
          python3 scripts/publish_seo003_articles.py
