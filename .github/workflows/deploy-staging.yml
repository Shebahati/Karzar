name: Deploy Staging

# Staging = live VPS serving karzartools.com (single host until prod is split).
# CR-011 Option B (2026-07-30): NO push-to-main auto-deploy — human must
# Actions → Deploy Staging → Run workflow (workflow_dispatch) on `main`.
#
# Handoff (Prompt 85 cutover): GitHub-hosted freeze/authorization only.
# Self-hosted karzar-vps packages from local git mirror → workspace → tracked
# tree + frontend image bundle → /opt/karzar/incoming/<sha> (transport=local-package).
# Deploy job verifies markers, live-rsyncs, rebuilds, smokes. Cleanup is local
# on karzar-vps (no GitHub→VPS SSH). Never on fork PRs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy-freeze:
    name: Deployment freeze gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch and deployment freeze
        env:
          DEPLOY_FREEZE: ${{ vars.KARZAR_DEPLOY_FREEZE }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploys are allowed only from main (got $DISPATCH_REF)."
            exit 1
          fi
          if [[ "${DEPLOY_FREEZE:-}" == "true" ]]; then
            echo "::error::Deployments are frozen by KARZAR_DEPLOY_FREEZE. Owner must document the incident/change before unfreezing."
            exit 1
          fi

  package:
    name: Self-hosted package + FE images
    needs: deploy-freeze
    runs-on: [self-hosted, karzar-vps]
    timeout-minutes: 120
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    # No cross-job outputs. Deploy verify reads HANDOFF_COMPLETE and
    # FRONTEND_IMAGES_HANDOFF_COMPLETE on disk.
    steps:
      - name: Checkout workflow scripts at dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Ensure mirror + local package into incoming
        env:
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          KARZAR_PACKAGE_DRY_RUN: "0"
          FORCE_REPACKAGE: "1"
          KARZAR_PACKAGE_CLEANUP_AFTER: "0"
          KARZAR_USE_GHA_CACHE: "0"
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
          NEXT_PUBLIC_API_BASE_URL: https://api.karzartools.com/api/v1
          NEXT_PUBLIC_SITE_URL: https://www.karzartools.com
          NEXT_PUBLIC_SEO_INDEXABLE: "true"
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-NT8ZT3G6HC
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "invalid GITHUB_SHA" >&2
            exit 1
          fi
          cd /opt/karzar/workspace
          chmod +x "${GITHUB_WORKSPACE}/workflow-src/deploy/staging/scripts/"*.sh
          SCRIPTS="${GITHUB_WORKSPACE}/workflow-src/deploy/staging/scripts"
          bash "${SCRIPTS}/ensure-git-mirror.sh" "$GITHUB_SHA"
          bash "${SCRIPTS}/package-incoming-local.sh"
          IN="/opt/karzar/incoming/${GITHUB_SHA}"
          test -f "$IN/HANDOFF_COMPLETE"
          test -f "$IN/deploy-manifest.sha256"
          test -d "$IN/tree"
          test -f "$IN/frontend-images/FRONTEND_IMAGES_HANDOFF_COMPLETE"
          test -f "$IN/frontend-images/frontend-images.tar"
          echo "PACKAGE_JOB_OK sha=${GITHUB_SHA}"

  deploy:
    name: Sync + rebuild staging
    needs: package
    runs-on: [self-hosted, karzar-vps]
    environment: staging
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    steps:
      - name: Diagnose incoming permissions
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IN="/opt/karzar/incoming/${GITHUB_SHA}"
          FE="${IN}/frontend-images"
          echo "SELF_HOSTED_ID:"
          id
          echo "INCOMING_PATH_METADATA:"
          namei -l "$IN/deploy-manifest.sha256" || true
          stat -c '%A %a %U:%G %n' \
            "$IN" \
            "$IN/tree" \
            "$IN/HANDOFF_COMPLETE" \
            "$IN/deploy-manifest.sha256" \
            "$FE/${KARZAR_FRONTEND_IMAGES_MARKER:-FRONTEND_IMAGES_HANDOFF_COMPLETE}" \
            || true

      - name: Verify incoming source
        env:
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          HANDOFF_VERIFY_MODE: consume
        run: |
          set -euo pipefail
          IN="/opt/karzar/incoming/${GITHUB_SHA}"
          test -f "$IN/HANDOFF_COMPLETE"
          test -d "$IN/tree"
          test -f "$IN/deploy-manifest.sha256"
          bash "$IN/tree/deploy/staging/scripts/verify-incoming-source.sh"

      - name: Verify incoming frontend images handoff
        env:
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          KARZAR_FE_VERIFY_ONLY: "1"
        run: |
          set -euo pipefail
          IN="/opt/karzar/incoming/${GITHUB_SHA}"
          test -f "$IN/frontend-images/FRONTEND_IMAGES_HANDOFF_COMPLETE"
          test -f "$IN/frontend-images/frontend-images.tar"
          test -f "$IN/frontend-images/frontend-images.sha256"
          bash "$IN/tree/deploy/staging/scripts/load-incoming-frontend-images.sh"

      - name: Sync backend → /opt/karzar/Karzar
        run: |
          set -euo pipefail
          SRC="/opt/karzar/incoming/${{ github.sha }}/tree"
          # Anchor /frontend/ to the transfer root. A bare 'frontend/' also
          # excludes deploy/staging/frontend/ (Dockerfiles, build context paths).
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '/frontend/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.env' \
            --exclude '.deploy-secrets' \
            --exclude '.env.staging.generated' \
            --exclude 'backups/' \
            --exclude 'rollout-backups/' \
            --exclude 'data/uploads/' \
            --exclude 'logs/' \
            --exclude '*.pyc' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude 'actions-runner/' \
            "$SRC"/ /opt/karzar/Karzar/
          rm -rf /opt/karzar/Karzar/frontend

      - name: Sync frontend → /opt/karzar/frontend
        run: |
          set -euo pipefail
          SRC="/opt/karzar/incoming/${{ github.sha }}/tree"
          rsync -a --delete \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env*.local' \
            "$SRC"/frontend/ /opt/karzar/frontend/

      - name: Rebuild backend + frontend
        env:
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          KARZAR_REQUIRE_PREBUILT_FRONTEND_IMAGES: "1"
        run: |
          set -euo pipefail
          cd /opt/karzar/Karzar
          chmod +x deploy/staging/scripts/*.sh || true
          chmod +x scripts/backup_db.sh scripts/backup_uploads.sh scripts/backup_offsite_sync.sh
          bash deploy/staging/scripts/deploy-backend.sh

          bash deploy/staging/scripts/load-incoming-frontend-images.sh

          export FRONTEND_ROOT=/opt/karzar/frontend
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://api.karzartools.com/api/v1}"
          export NEXT_PUBLIC_GA_MEASUREMENT_ID="${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-NT8ZT3G6HC}"
          if [[ -z "${ADMIN_SESSION_SECRET:-}" ]]; then
            for f in /opt/karzar/.deploy-secrets /opt/karzar/Karzar/.env; do
              if [[ -f "$f" ]] && grep -q '^ADMIN_SESSION_SECRET=' "$f"; then
                ADMIN_SESSION_SECRET="$(grep '^ADMIN_SESSION_SECRET=' "$f" | tail -1 | cut -d= -f2-)"
                break
              fi
            done
          fi
          if [[ -z "${ADMIN_SESSION_SECRET:-}" || "${#ADMIN_SESSION_SECRET}" -lt 32 ]]; then
            echo "ADMIN_SESSION_SECRET missing on server (.deploy-secrets / .env)" >&2
            exit 1
          fi
          export ADMIN_SESSION_SECRET
          bash deploy/staging/scripts/deploy-frontend.sh

          API_BASE=http://127.0.0.1:8000 \
          SHOP_BASE=http://127.0.0.1:3000 \
          ADMIN_BASE=http://127.0.0.1:3001 \
            bash deploy/staging/scripts/run-smoke-staging.sh

  # Incoming/<sha> is created by github-runner on the VPS. Cleanup is local
  # (no GitHub→VPS SSH). Failed deploys retain incoming for diagnosis.
  cleanup:
    name: Cleanup incoming package
    needs: deploy
    runs-on: [self-hosted, karzar-vps]
    timeout-minutes: 5
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Shebahati/Karzar' &&
      needs.deploy.result == 'success'
    steps:
      - name: Checkout cleanup script at dispatch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: workflow-src

      - name: Delete incoming handoff locally
        env:
          GITHUB_SHA: ${{ github.sha }}
          KARZAR_INCOMING_BASE: /opt/karzar/incoming
        run: |
          set -euo pipefail
          cd /opt/karzar/workspace
          chmod +x "${GITHUB_WORKSPACE}/workflow-src/deploy/staging/scripts/cleanup-incoming-source.sh"
          # Unset SSH_HOST so cleanup uses local delete (not SSH path).
          env -u SSH_HOST \
            GITHUB_SHA="$GITHUB_SHA" \
            KARZAR_INCOMING_BASE="$KARZAR_INCOMING_BASE" \
            bash "${GITHUB_WORKSPACE}/workflow-src/deploy/staging/scripts/cleanup-incoming-source.sh"
