name: Deploy Staging

# Staging = live VPS serving karzartools.com (single host until prod is split).
# CR-011 Option B (2026-07-30): NO push-to-main auto-deploy — human must
# Actions → Deploy Staging → Run workflow (workflow_dispatch) on `main`.
# Pattern: checkout on GitHub-hosted (VPS often gets 504 from github.com), then
# artifact → self-hosted runner for local rsync/rebuild. Never runs on fork PRs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  package:
    name: Package sources
    runs-on: ubuntu-latest
    # Same-repo only (never trust fork workflows on self-hosted)
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-src-${{ github.sha }}
          path: |
            .
            !.git
            !.github
            !**/.venv
            !**/venv
            !**/node_modules
            !**/.next
            !**/__pycache__
            !**/.pytest_cache
            !**/.mypy_cache
            !**/.ruff_cache
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Sync + rebuild staging
    needs: package
    runs-on: [self-hosted, karzar-vps]
    environment: staging
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    steps:
      - name: Download deploy artifact
        uses: actions/download-artifact@v8
        with:
          name: staging-src-${{ github.sha }}
          path: ${{ runner.temp }}/staging-src

      - name: Sync backend → /opt/karzar/Karzar
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/staging-src"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.env' \
            --exclude '.deploy-secrets' \
            --exclude '.env.staging.generated' \
            --exclude 'backups/' \
            --exclude 'data/uploads/' \
            --exclude 'logs/' \
            --exclude '*.pyc' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude 'actions-runner/' \
            "$SRC"/ /opt/karzar/Karzar/
          # rsync --exclude 'frontend/' preserves a stale tree; remove it explicitly
          rm -rf /opt/karzar/Karzar/frontend

      - name: Sync frontend → /opt/karzar/frontend
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/staging-src"
          rsync -a --delete \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env*.local' \
            "$SRC"/frontend/ /opt/karzar/frontend/

      - name: Rebuild backend + frontend
        run: |
          set -euo pipefail
          cd /opt/karzar/Karzar
          chmod +x deploy/staging/scripts/*.sh || true
          bash deploy/staging/scripts/deploy-backend.sh

          export FRONTEND_ROOT=/opt/karzar/frontend
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://api.karzartools.com/api/v1}"
          if [[ -z "${ADMIN_SESSION_SECRET:-}" ]]; then
            for f in /opt/karzar/.deploy-secrets /opt/karzar/Karzar/.env; do
              if [[ -f "$f" ]] && grep -q '^ADMIN_SESSION_SECRET=' "$f"; then
                ADMIN_SESSION_SECRET="$(grep '^ADMIN_SESSION_SECRET=' "$f" | tail -1 | cut -d= -f2-)"
                break
              fi
            done
          fi
          if [[ -z "${ADMIN_SESSION_SECRET:-}" || "${#ADMIN_SESSION_SECRET}" -lt 32 ]]; then
            echo "ADMIN_SESSION_SECRET missing on server (.deploy-secrets / .env)" >&2
            exit 1
          fi
          export ADMIN_SESSION_SECRET
          bash deploy/staging/scripts/deploy-frontend.sh

          # OPS-20: hard smoke gate — admin must not soft-fail.
          API_BASE=http://127.0.0.1:8000 \
          SHOP_BASE=http://127.0.0.1:3000 \
          ADMIN_BASE=http://127.0.0.1:3001 \
            bash deploy/staging/scripts/smoke-staging.sh

          # SEO-003: Category B deploy-time CMS publish (ADR-012 / CR-004 residual).
          # Not Category A enrichment — articles.json is Git SoT; live host is destination.
          export FRONTEND_ROOT="${FRONTEND_ROOT:-/opt/karzar/frontend}"
          export KARZAR_API_BASE="${KARZAR_API_BASE:-https://api.karzartools.com/api/v1}"
          export KARZAR_ALLOW_PRODUCTION_WRITE=1
          export KARZAR_INGESTION_CATEGORY=B
          # Creds live in preserved server .env / .deploy-secrets (rsync-excluded).
          set -a
          # shellcheck disable=SC1091
          [[ -f /opt/karzar/.deploy-secrets ]] && source /opt/karzar/.deploy-secrets
          # shellcheck disable=SC1091
          [[ -f /opt/karzar/Karzar/.env ]] && source /opt/karzar/Karzar/.env
          set +a
          python3 scripts/publish_seo003_articles.py
