name: Deploy Staging

# Staging = live VPS serving karzartools.com (single host until prod is split).
# CR-011 Option B (2026-07-30): NO push-to-main auto-deploy — human must
# Actions → Deploy Staging → Run workflow (workflow_dispatch) on `main`.
# Handoff: GitHub-hosted builds a deploy tree + SHA-256 manifest, seeds
# /opt/karzar/incoming/<sha>/tree from live (non-mutating), then delta-rsyncs
# over IPv4 SSH. karzar-vps only reads that local tree after HANDOFF_COMPLETE.
# Do not checkout or download Actions artifacts on karzar-vps
# (VPS→github.com 504s / hangs; VPS→Azure blob fails). Never runs on fork PRs.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy-freeze:
    name: Deployment freeze gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch and deployment freeze
        env:
          DEPLOY_FREEZE: ${{ vars.KARZAR_DEPLOY_FREEZE }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploys are allowed only from main (got $DISPATCH_REF)."
            exit 1
          fi
          if [[ "${DEPLOY_FREEZE:-}" == "true" ]]; then
            echo "::error::Deployments are frozen by KARZAR_DEPLOY_FREEZE. Owner must document the incident/change before unfreezing."
            exit 1
          fi

  package:
    name: Prepare and rsync sources
    needs: deploy-freeze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    # No cross-job outputs. Actions secret-masking dropped the package-job
    # manifest digest (Deploy Staging run 34039051081). Self-hosted verify
    # reads HANDOFF_COMPLETE.
    steps:
      - name: Checkout exact workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Delta-rsync deploy tree to VPS incoming
        id: push
        env:
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          chmod +x deploy/staging/scripts/*.sh || true
          bash deploy/staging/scripts/push-incoming-source.sh

  deploy:
    name: Sync + rebuild staging
    needs: package
    runs-on: [self-hosted, karzar-vps]
    environment: staging
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    steps:
      - name: Diagnose incoming permissions
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          IN="/opt/karzar/incoming/${GITHUB_SHA}"
          echo "SELF_HOSTED_ID:"
          id
          echo "INCOMING_PATH_METADATA:"
          namei -l "$IN/deploy-manifest.sha256" || true
          stat -c '%A %a %U:%G %n' \
            "$IN" \
            "$IN/tree" \
            "$IN/HANDOFF_COMPLETE" \
            "$IN/deploy-manifest.sha256" \
            "$IN/tree/deploy/staging/scripts/verify-incoming-source.sh" \
            || true

      - name: Verify incoming source
        env:
          GITHUB_SHA: ${{ github.sha }}
          EXPECTED_SHA: ${{ github.sha }}
          HANDOFF_VERIFY_MODE: consume
        run: |
          set -euo pipefail
          IN="/opt/karzar/incoming/${GITHUB_SHA}"
          test -f "$IN/HANDOFF_COMPLETE"
          test -d "$IN/tree"
          test -f "$IN/deploy-manifest.sha256"
          bash "$IN/tree/deploy/staging/scripts/verify-incoming-source.sh"

      - name: Sync backend → /opt/karzar/Karzar
        run: |
          set -euo pipefail
          SRC="/opt/karzar/incoming/${{ github.sha }}/tree"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.env' \
            --exclude '.deploy-secrets' \
            --exclude '.env.staging.generated' \
            --exclude 'backups/' \
            --exclude 'data/uploads/' \
            --exclude 'logs/' \
            --exclude '*.pyc' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude 'actions-runner/' \
            "$SRC"/ /opt/karzar/Karzar/
          rm -rf /opt/karzar/Karzar/frontend

      - name: Sync frontend → /opt/karzar/frontend
        run: |
          set -euo pipefail
          SRC="/opt/karzar/incoming/${{ github.sha }}/tree"
          rsync -a --delete \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env*.local' \
            "$SRC"/frontend/ /opt/karzar/frontend/

      - name: Rebuild backend + frontend
        run: |
          set -euo pipefail
          cd /opt/karzar/Karzar
          chmod +x deploy/staging/scripts/*.sh || true
          chmod +x scripts/backup_db.sh scripts/backup_uploads.sh scripts/backup_offsite_sync.sh
          bash deploy/staging/scripts/deploy-backend.sh

          export FRONTEND_ROOT=/opt/karzar/frontend
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://api.karzartools.com/api/v1}"
          export NEXT_PUBLIC_GA_MEASUREMENT_ID="${NEXT_PUBLIC_GA_MEASUREMENT_ID:-G-NT8ZT3G6HC}"
          if [[ -z "${ADMIN_SESSION_SECRET:-}" ]]; then
            for f in /opt/karzar/.deploy-secrets /opt/karzar/Karzar/.env; do
              if [[ -f "$f" ]] && grep -q '^ADMIN_SESSION_SECRET=' "$f"; then
                ADMIN_SESSION_SECRET="$(grep '^ADMIN_SESSION_SECRET=' "$f" | tail -1 | cut -d= -f2-)"
                break
              fi
            done
          fi
          if [[ -z "${ADMIN_SESSION_SECRET:-}" || "${#ADMIN_SESSION_SECRET}" -lt 32 ]]; then
            echo "ADMIN_SESSION_SECRET missing on server (.deploy-secrets / .env)" >&2
            exit 1
          fi
          export ADMIN_SESSION_SECRET
          bash deploy/staging/scripts/deploy-frontend.sh

          API_BASE=http://127.0.0.1:8000 \
          SHOP_BASE=http://127.0.0.1:3000 \
          ADMIN_BASE=http://127.0.0.1:3001 \
            bash deploy/staging/scripts/smoke-staging.sh

          export FRONTEND_ROOT="${FRONTEND_ROOT:-/opt/karzar/frontend}"
          export KARZAR_API_BASE="${KARZAR_API_BASE:-https://api.karzartools.com/api/v1}"
          export KARZAR_ALLOW_PRODUCTION_WRITE=1
          export KARZAR_INGESTION_CATEGORY=B
          set -a
          # shellcheck disable=SC1091
          [[ -f /opt/karzar/.deploy-secrets ]] && source /opt/karzar/.deploy-secrets
          # shellcheck disable=SC1091
          [[ -f /opt/karzar/Karzar/.env ]] && source /opt/karzar/Karzar/.env
          set +a
          python3 scripts/publish_seo003_articles.py

      - name: Cleanup incoming package
        if: success()
        run: |
          set -euo pipefail
          rm -rf "/opt/karzar/incoming/${{ github.sha }}"
          find /opt/karzar/incoming -mindepth 1 -maxdepth 1 -mtime +1 -exec rm -rf {} + || true
