name: Deploy Production

# NOTE (2026-07): Production host is NOT split yet — same VPS as staging (karzartools.com).
# Dangerous to auto-deploy: ONLY workflow_dispatch + GitHub Environment `production`
# (required reviewer: Shebahati, wait timer). Do not trigger on push to main.
# Pattern: package on ubuntu-latest, deploy on self-hosted (avoids VPS→github.com 504).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy-production to confirm (same VPS as staging)'
        required: true
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  deploy-freeze:
    name: Deployment freeze gate
    runs-on: ubuntu-latest
    steps:
      - name: Enforce main branch and deployment freeze
        env:
          DEPLOY_FREEZE: ${{ vars.KARZAR_DEPLOY_FREEZE }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$DISPATCH_REF" != "refs/heads/main" ]]; then
            echo "::error::Deploys are allowed only from main (got $DISPATCH_REF)."
            exit 1
          fi
          if [[ "${DEPLOY_FREEZE:-}" == "true" ]]; then
            echo "::error::Deployments are frozen by KARZAR_DEPLOY_FREEZE. Owner must document the incident/change before unfreezing."
            exit 1
          fi

  package:
    name: Package sources
    needs: deploy-freeze
    runs-on: ubuntu-latest
    if: github.repository == 'Shebahati/Karzar' && github.event.inputs.confirm == 'deploy-production'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload deploy artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-src-${{ github.sha }}
          path: |
            .
            !.git
            !.github
            !**/.venv
            !**/venv
            !**/node_modules
            !**/.next
            !**/__pycache__
            !**/.pytest_cache
            !**/.mypy_cache
            !**/.ruff_cache
          retention-days: 1
          include-hidden-files: true

  deploy:
    name: Sync + rebuild production
    needs: package
    runs-on: [self-hosted, karzar-vps]
    environment: production
    if: github.repository == 'Shebahati/Karzar' && github.event.inputs.confirm == 'deploy-production'
    steps:
      - name: Probe artifact storage (no secrets)
        continue-on-error: true
        run: |
          set +e
          echo "IPv4/IPv6 lookups (no signed URLs)"
          for h in results.actions.githubusercontent.com \
                   productionresultssa9.blob.core.windows.net \
                   blob.core.windows.net \
                   api.github.com; do
            echo "== $h"
            getent ahostsv4 "$h" | awk '{print $1}' | sort -u
            getent ahostsv6 "$h" | awk '{print $1}' | sort -u
          done
          for u in https://results.actions.githubusercontent.com/ \
                   https://productionresultssa9.blob.core.windows.net/ \
                   https://api.github.com/; do
            echo "== HEAD $u"
            curl -4 -sS -I -o /dev/null \
              -w 'ipv4 http=%{http_code} time=%{time_total} ip=%{remote_ip}\n' \
              --connect-timeout 10 --max-time 20 "$u" || echo "ipv4 FAIL"
            curl -6 -sS -I -o /dev/null \
              -w 'ipv6 http=%{http_code} time=%{time_total} ip=%{remote_ip}\n' \
              --connect-timeout 4 --max-time 8 "$u" || echo "ipv6 FAIL"
          done
          exit 0

      - name: Download deploy artifact
        id: artifact
        continue-on-error: true
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        uses: actions/download-artifact@v4
        with:
          name: production-src-${{ github.sha }}
          path: ${{ runner.temp }}/production-src

      - name: Clear partial artifact dir
        if: steps.artifact.outcome != 'success'
        run: rm -rf "${{ runner.temp }}/production-src"

      - name: Download deploy artifact over IPv4 (fallback)
        if: steps.artifact.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: production-src-${{ github.sha }}
          DEST: ${{ runner.temp }}/production-src
        run: |
          set -euo pipefail
          echo "download-artifact@v4 failed; fetching zip via api.github.com over IPv4"
          mkdir -p "$DEST"
          ZIP="${RUNNER_TEMP}/production-src-artifact.zip"
          LIST_JSON="$(curl -4 -fsS --retry 8 --retry-all-errors --retry-delay 3 --connect-timeout 15 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")"
          AID="$(printf '%s' "$LIST_JSON" | python3 -c "import json,os,sys; name=os.environ['ARTIFACT_NAME']; data=json.loads(sys.stdin.read()); ids=[a.get('id') for a in (data.get('artifacts') or []) if a.get('name')==name and not a.get('expired')]; raise SystemExit('artifact_not_found:'+name) if not ids else print(ids[0])")"
          echo "artifact_id=${AID}"
          curl -4 -fL --retry 12 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -o "$ZIP" \
            -w "artifact_http=%{http_code} time=%{time_total} ip=%{remote_ip} bytes=%{size_download}\n" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip"
          ZIP="$ZIP" DEST="$DEST" python3 -c "import os,zipfile,pathlib; z,d=os.environ['ZIP'],os.environ['DEST']; pathlib.Path(d).mkdir(parents=True, exist_ok=True); zf=zipfile.ZipFile(z); names=zf.namelist(); zf.extractall(d); zf.close(); print('extracted_files=%d' % len(names))"
          rm -f "$ZIP"

      - name: Verify source handoff
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/production-src"
          test -f "$SRC/deploy/staging/scripts/deploy-frontend.sh"
          test -d "$SRC/frontend/Storefront"
          echo "HANDOFF_OK sha=${{ github.sha }} artifact=${{ steps.artifact.outcome }}"

      - name: Sync backend → /opt/karzar/Karzar
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/production-src"
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'frontend/' \
            --exclude '.venv/' \
            --exclude 'venv/' \
            --exclude '__pycache__/' \
            --exclude '.pytest_cache/' \
            --exclude '.env' \
            --exclude '.deploy-secrets' \
            --exclude '.env.staging.generated' \
            --exclude 'backups/' \
            --exclude 'data/uploads/' \
            --exclude 'logs/' \
            --exclude '*.pyc' \
            --exclude '.mypy_cache/' \
            --exclude '.ruff_cache/' \
            --exclude '.coverage' \
            --exclude 'actions-runner/' \
            "$SRC"/ /opt/karzar/Karzar/

      - name: Sync frontend → /opt/karzar/frontend
        run: |
          set -euo pipefail
          SRC="${{ runner.temp }}/production-src"
          rsync -a --delete \
            --exclude 'node_modules/' \
            --exclude '.next/' \
            --exclude 'out/' \
            --exclude '.git/' \
            --exclude '.env' \
            --exclude '.env*.local' \
            "$SRC"/frontend/ /opt/karzar/frontend/

      - name: Rebuild backend + frontend
        run: |
          set -euo pipefail
          cd /opt/karzar/Karzar
          chmod +x deploy/staging/scripts/*.sh || true
          chmod +x scripts/backup_db.sh scripts/backup_uploads.sh scripts/backup_offsite_sync.sh
          bash deploy/staging/scripts/deploy-backend.sh

          export FRONTEND_ROOT=/opt/karzar/frontend
          export NEXT_PUBLIC_API_BASE_URL="${NEXT_PUBLIC_API_BASE_URL:-https://api.karzartools.com/api/v1}"
          if [[ -z "${ADMIN_SESSION_SECRET:-}" ]]; then
            for f in /opt/karzar/.deploy-secrets /opt/karzar/Karzar/.env; do
              if [[ -f "$f" ]] && grep -q '^ADMIN_SESSION_SECRET=' "$f"; then
                ADMIN_SESSION_SECRET="$(grep '^ADMIN_SESSION_SECRET=' "$f" | tail -1 | cut -d= -f2-)"
                break
              fi
            done
          fi
          if [[ -z "${ADMIN_SESSION_SECRET:-}" || "${#ADMIN_SESSION_SECRET}" -lt 32 ]]; then
            echo "ADMIN_SESSION_SECRET missing on server (.deploy-secrets / .env)" >&2
            exit 1
          fi
          export ADMIN_SESSION_SECRET
          bash deploy/staging/scripts/deploy-frontend.sh

          # OPS-20: hard smoke gate — admin must not soft-fail.
          API_BASE=http://127.0.0.1:8000 \
          SHOP_BASE=http://127.0.0.1:3000 \
          ADMIN_BASE=http://127.0.0.1:3001 \
            bash deploy/staging/scripts/smoke-staging.sh
