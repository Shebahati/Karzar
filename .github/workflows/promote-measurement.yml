# Runs on karzar-vps against the live compose stack.
# Uses the script already synced by Deploy Staging (no actions/checkout —
# checkout hangs on this runner).
name: Promote Measurement Taxonomy

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run or apply"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - apply

jobs:
  promote:
    runs-on: [self-hosted, karzar-vps]
    steps:
      - name: Enforce Phase 0 freeze for apply mode
        if: inputs.mode == 'apply'
        env:
          DEPLOY_FREEZE: ${{ vars.KARZAR_DEPLOY_FREEZE }}
        run: |
          set -euo pipefail
          if [[ "${DEPLOY_FREEZE:-}" == "true" ]]; then
            echo "::error::Live data mutations are frozen by KARZAR_DEPLOY_FREEZE."
            exit 1
          fi

      - name: Run promote (via-db) from deploy tree
        working-directory: /opt/karzar/Karzar
        run: |
          set -euo pipefail
          test -f scripts/promote_measurement_to_l1.py
          MODE="${{ inputs.mode }}"
          if [ "$MODE" = "apply" ]; then
            docker compose exec -T app \
              python scripts/promote_measurement_to_l1.py --via-db --apply --confirm
          else
            docker compose exec -T app \
              python scripts/promote_measurement_to_l1.py --via-db
          fi
