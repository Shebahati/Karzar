name: Backend CI

# Required Protect-main checks: aods, lint, test (stable job names).
# Risk-aware execution via scripts/ci/classify_changes.py (.github/ci/policy.json).
on:
  workflow_dispatch:
    inputs:
      force_full:
        description: Run full backend tier (ignore path classifier reductions)
        type: boolean
        default: true
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      risk_tier: ${{ steps.classify.outputs.risk_tier }}
      scenario: ${{ steps.classify.outputs.scenario }}
      run_backend_lint: ${{ steps.classify.outputs.run_backend_lint }}
      run_backend_test_heavy: ${{ steps.classify.outputs.run_backend_test_heavy }}
      run_aods_fast: ${{ steps.classify.outputs.run_aods_fast }}
      run_aods_openapi: ${{ steps.classify.outputs.run_aods_openapi }}
      run_deploy_staging_guard: ${{ steps.classify.outputs.run_deploy_staging_guard }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Classify
        id: classify
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          args=(--github-output)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_full }}" = "true" ]; then
            args+=(--force-full)
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            args+=(--base "HEAD~1" --head HEAD)
          else
            args+=(--base origin/main --head HEAD --pr-labels "$PR_LABELS")
          fi
          python3 scripts/ci/classify_changes.py "${args[@]}"

  aods:
    name: aods
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch origin/main for merge-base checks
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: AODS fast gates
        if: needs.classify.outputs.run_aods_fast == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python3 aods/tools/aods_validate.py \
            --gate registry --gate links --gate naming --gate ingestion-boundary

      - name: Install runtime deps (OpenAPI gate imports app.main)
        if: needs.classify.outputs.run_aods_openapi == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: AODS OpenAPI gate
        if: needs.classify.outputs.run_aods_openapi == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python3 aods/tools/aods_validate.py --gate openapi

  lint:
    name: lint
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip Python lint (classifier R0/R1)
        if: needs.classify.outputs.run_backend_lint != 'true'
        run: echo "No backend lint required (tier=${{ needs.classify.outputs.risk_tier }}, scenario=${{ needs.classify.outputs.scenario }})."

      - name: Setup Python
        if: needs.classify.outputs.run_backend_lint == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        if: needs.classify.outputs.run_backend_lint == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        if: needs.classify.outputs.run_backend_lint == 'true'
        run: ruff check app tests services/gsc_mcp

      - name: Mypy
        if: needs.classify.outputs.run_backend_lint == 'true'
        run: mypy app

  test:
    name: test
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip backend tests (classifier R0/R1)
        if: needs.classify.outputs.run_backend_test_heavy != 'true' && needs.classify.outputs.run_deploy_staging_guard != 'true'
        run: |
          echo "No Postgres/Redis pytest (tier=${{ needs.classify.outputs.risk_tier }}, scenario=${{ needs.classify.outputs.scenario }})."

      - name: Deploy staging Dockerfile guard
        if: needs.classify.outputs.run_deploy_staging_guard == 'true'
        run: bash deploy/staging/scripts/test-dockerfile-pypi-fallback.sh

      - name: Setup Python
        if: needs.classify.outputs.run_backend_test_heavy == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements.txt

      - name: Start Postgres and Redis
        if: needs.classify.outputs.run_backend_test_heavy == 'true'
        run: bash scripts/ci/start_integration_services.sh

      - name: Install dependencies
        if: needs.classify.outputs.run_backend_test_heavy == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r services/gsc_mcp/requirements.txt

      - name: Run database migrations
        if: needs.classify.outputs.run_backend_test_heavy == 'true'
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: karzar_ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          ADMIN_STEP_UP_PIN: 93827461
          DEBUG: "true"
          ENABLE_API_DOCS: "false"
          USE_POSTGRES_TESTS: "1"
          ALLOW_PUBLIC_REGISTER: "true"
          OTP_DEV_ECHO: "true"
        run: alembic upgrade head

      - name: Run tests with coverage gate
        if: needs.classify.outputs.run_backend_test_heavy == 'true'
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_SERVER: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: karzar_ci
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          SECRET_KEY: ci-secret-key-with-at-least-32-characters
          ADMIN_STEP_UP_PIN: 93827461
          DEBUG: "true"
          ENABLE_API_DOCS: "false"
          USE_POSTGRES_TESTS: "1"
          ALLOW_PUBLIC_REGISTER: "true"
          OTP_DEV_ECHO: "true"
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest --maxfail=1 --disable-warnings \
            --cov=app --cov-report=term-missing --cov-fail-under=68

      - name: Stop integration services
        if: always() && needs.classify.outputs.run_backend_test_heavy == 'true'
        run: docker rm -f ci-postgres ci-redis >/dev/null 2>&1 || true
