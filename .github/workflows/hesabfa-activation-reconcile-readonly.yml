# One-shot read-only Hesabfa activation reconciliation for PR #398.
# workflow_dispatch only. No push trigger. No deploy. No live-tree checkout.
# Remove this file after the audit; it must not remain on main.
name: Hesabfa Activation Reconcile Read-only

on:
  workflow_dispatch:

concurrency:
  group: hesabfa-activation-reconcile-readonly
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  reconcile:
    name: Read-only Hesabfa activation reconciliation
    runs-on: [self-hosted, karzar-vps]
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Shebahati/Karzar'
    steps:
      - name: Read-only reconciliation
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          redact() {
            sed -E \
              -e 's/(password|passwd|secret|token|api[_-]?key|authorization|bearer)[[:space:]]*[=:][[:space:]]*[^[:space:]]+/[REDACTED]/gi' \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#gi' \
              -e 's/\b09[0-9]{9}\b/[REDACTED_PHONE]/g' \
              -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/[REDACTED_EMAIL]/g'
          }

          fail() {
            echo "FATAL: $*" >&2
            exit 1
          }

          SHA="${EXPECTED_SHA}"
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            fail "github.sha is not a 40-hex commit"
          fi

          echo "=== REFUSE LIVE MUTATION HELPERS ==="
          LIVE_BEFORE="$(stat -c '%Y' /opt/karzar/Karzar 2>/dev/null || echo 0)"

          echo "=== 1. HOST / CONTAINER IDENTITY ==="
          HOSTNAME_NOW="$(hostname)"
          echo "host=${HOSTNAME_NOW}"
          if [[ "$HOSTNAME_NOW" != "srv5944957438" ]]; then
            fail "host is ${HOSTNAME_NOW}, expected srv5944957438"
          fi
          API_RUNNING="$(docker inspect lathe_api --format '{{.State.Running}}' 2>/dev/null || echo missing)"
          DB_RUNNING="$(docker inspect lathe_postgres --format '{{.State.Running}}' 2>/dev/null || echo missing)"
          echo "container_lathe_api_running=${API_RUNNING}"
          echo "container_lathe_postgres_running=${DB_RUNNING}"
          [[ "$API_RUNNING" == "true" ]] || fail "lathe_api is not running"
          [[ "$DB_RUNNING" == "true" ]] || fail "lathe_postgres is not running"
          MOUNTS="$(docker inspect lathe_postgres --format '{{range .Mounts}}{{.Name}} {{.Destination}}{{"\n"}}{{end}}')"
          echo "postgres_mounts<<EOF"
          printf '%s\n' "$MOUNTS"
          echo "EOF"
          printf '%s\n' "$MOUNTS" | grep -q 'karzar_postgres_data' || fail "volume karzar_postgres_data not mounted"

          echo "=== 2. PROCESS LABELS ==="
          APP_ENV="$(docker exec lathe_api sh -c 'printf %s "$APP_ENV"')"
          DATA_PLANE="$(docker exec lathe_api sh -c 'printf %s "${KARZAR_DATA_PLANE-}"')"
          echo "APP_ENV=${APP_ENV}"
          if [[ -z "$DATA_PLANE" ]]; then
            echo "KARZAR_DATA_PLANE=unset"
          else
            echo "KARZAR_DATA_PLANE=${DATA_PLANE}"
          fi
          if [[ "$DATA_PLANE" == "catalog_staging" ]]; then
            fail "KARZAR_DATA_PLANE=catalog_staging is not the CR-011 live plane"
          fi
          if [[ -n "$DATA_PLANE" && "$DATA_PLANE" != "live" ]]; then
            fail "KARZAR_DATA_PLANE=${DATA_PLANE} is not live"
          fi

          echo "=== 3. DATABASE READ-ONLY IDENTITY ==="
          docker exec -i lathe_api python - <<'PY' | tee /tmp/karzar-hesabfa-db-identity.txt
          import asyncio
          from sqlalchemy import text

          async def main() -> None:
              from app.db.database import async_session_maker

              async with async_session_maker() as session:
                  await session.execute(text("SET TRANSACTION READ ONLY"))
                  shown = (await session.execute(text("SHOW transaction_read_only"))).scalar_one()
                  dbname = (await session.execute(text("SELECT current_database()"))).scalar_one()
                  revisions = (await session.execute(text("SELECT version_num FROM alembic_version"))).scalars().all()
                  await session.rollback()
              if str(shown).strip().lower() != "on":
                  raise SystemExit(f"transaction_read_only={shown}")
              if str(dbname) != "karzar_staging":
                  raise SystemExit(f"unexpected database name {dbname}")
              if not revisions:
                  raise SystemExit("alembic_version is empty")
              print(f"transaction_read_only={shown}")
              print(f"database={dbname}")
              print("alembic=" + ",".join(str(item) for item in revisions))

          asyncio.run(main())
          PY

          echo "=== 4. HESABFA CREDENTIAL PRESENCE ==="
          docker exec -i lathe_api python - <<'PY'
          from app.core.config import settings

          def yes(value: object) -> str:
              return "YES" if value else "NO"

          enabled = bool(settings.HESABFA_ENABLED)
          api_key = bool((settings.HESABFA_API_KEY or "").strip())
          login = bool((settings.HESABFA_LOGIN_TOKEN or "").strip())
          print(f"HESABFA_ENABLED_PRESENT={yes(enabled)}")
          print(f"HESABFA_API_KEY_PRESENT={yes(api_key)}")
          print(f"HESABFA_LOGIN_TOKEN_PRESENT={yes(login)}")
          if not (enabled and api_key and login):
              raise SystemExit("Hesabfa read credentials are absent")
          PY

          echo "=== 5. FETCH PR SHA INTO /tmp ==="
          MIRROR="${KARZAR_MIRROR:-/opt/karzar/mirror/Karzar.git}"
          if [[ ! -d "$MIRROR" ]]; then
            fail "git mirror missing at ${MIRROR}"
          fi
          git -C "$MIRROR" remote set-url origin https://github.com/Shebahati/Karzar.git
          git -C "$MIRROR" fetch --prune origin '+refs/heads/*:refs/heads/*'
          git -C "$MIRROR" cat-file -e "${SHA}^{commit}" || fail "SHA ${SHA} not in mirror"
          DEST="/tmp/karzar-hesabfa-398/${SHA}"
          rm -rf "$DEST"
          mkdir -p "$DEST"
          git clone --shared --no-checkout "$MIRROR" "$DEST"
          git -C "$DEST" checkout --detach "$SHA"
          ACTUAL="$(git -C "$DEST" rev-parse HEAD)"
          echo "CHECKOUT_SHA=${ACTUAL}"
          [[ "$ACTUAL" == "$SHA" ]] || fail "checkout SHA ${ACTUAL} != ${SHA}"

          cleanup() {
            docker exec lathe_api rm -rf /tmp/karzar-pr398 /tmp/karzar-hesabfa-398-output /tmp/karzar-hesabfa-398-canary >/dev/null 2>&1 || true
            rm -rf "$DEST"
            LIVE_AFTER="$(stat -c '%Y' /opt/karzar/Karzar 2>/dev/null || echo 0)"
            if [[ "$LIVE_BEFORE" != "$LIVE_AFTER" ]]; then
              echo "FATAL: live tree mtime changed" >&2
            fi
          }
          trap cleanup EXIT

          echo "=== 6. STATIC WRITE-ENDPOINT GUARD ==="
          python3 - "$DEST" <<'PY'
          import ast
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          script = (root / "scripts/hesabfa_product_activation_reconcile.py").read_text(encoding="utf-8")
          reconcile = (root / "app/services/hesabfa/activation_reconcile.py").read_text(encoding="utf-8")
          if "DryRunHesabfaClient(get_hesabfa_client())" not in script:
              raise SystemExit("live path does not wrap Hesabfa in DryRunHesabfaClient")
          banned = {"save_item", "save_invoice", "save_contact", "delete_item"}
          for node in ast.walk(ast.parse(script)):
              if not isinstance(node, ast.Call):
                  continue
              func = node.func
              name = func.attr if isinstance(func, ast.Attribute) else func.id if isinstance(func, ast.Name) else ""
              if name in banned:
                  raise SystemExit(f"reconcile script calls {name}")
          for needle in (
              "dry-run forbids item/save",
              "dry-run forbids invoice/save",
              "dry-run forbids contact/save",
          ):
              if needle not in reconcile:
                  raise SystemExit(f"missing guard: {needle}")
          print("REMOTE_WRITE_METHODS_REACHABLE=0")
          PY

          echo "=== 7. COPY PR TREE INTO CONTAINER /tmp ==="
          docker exec lathe_api rm -rf /tmp/karzar-pr398
          docker exec lathe_api mkdir -p /tmp/karzar-pr398
          tar -C "$DEST" --exclude .git -cf - . | docker exec -i lathe_api tar -C /tmp/karzar-pr398 -xf -
          docker exec lathe_api test -f /tmp/karzar-pr398/scripts/hesabfa_product_activation_reconcile.py

          echo "=== 8. APPLY CANARY ==="
          set +e
          docker exec -e PYTHONPATH=/tmp/karzar-pr398 -w /tmp/karzar-pr398 lathe_api \
            python scripts/hesabfa_product_activation_reconcile.py --apply --output /tmp/karzar-hesabfa-398-canary \
            > /tmp/karzar-hesabfa-canary-1.out 2> /tmp/karzar-hesabfa-canary-1.err
          CANARY1=$?
          set -e
          echo "unconfirmed_apply_exit=${CANARY1}"
          redact < /tmp/karzar-hesabfa-canary-1.err || true
          [[ "$CANARY1" -eq 2 ]] || fail "unconfirmed --apply exit ${CANARY1}, expected 2"

          set +e
          docker exec \
            -e PYTHONPATH=/tmp/karzar-pr398 \
            -e KARZAR_ALLOW_PRODUCTION_WRITE=1 \
            -e KARZAR_INGESTION_CATEGORY=B \
            -w /tmp/karzar-pr398 \
            lathe_api \
            python scripts/hesabfa_product_activation_reconcile.py \
              --apply --confirm-production-write --output /tmp/karzar-hesabfa-398-canary \
            > /tmp/karzar-hesabfa-canary-2.out 2> /tmp/karzar-hesabfa-canary-2.err
          CANARY2=$?
          set -e
          echo "confirmed_apply_exit=${CANARY2}"
          redact < /tmp/karzar-hesabfa-canary-2.err || true
          [[ "$CANARY2" -eq 3 ]] || fail "confirmed --apply exit ${CANARY2}, expected 3"
          grep -q 'BLOCKED_PENDING_API_CONFIRMATION' /tmp/karzar-hesabfa-canary-2.err \
            || fail "confirmed --apply did not print BLOCKED_PENDING_API_CONFIRMATION"

          echo "=== 9. LIVE READ-ONLY SCAN ==="
          docker exec lathe_api rm -rf /tmp/karzar-hesabfa-398-output
          docker exec \
            -e PYTHONPATH=/tmp/karzar-pr398 \
            -e PYTHONUNBUFFERED=1 \
            -w /tmp/karzar-pr398 \
            lathe_api \
            python scripts/hesabfa_product_activation_reconcile.py \
              --dry-run --batch-size 250 --page-size 100 \
              --output /tmp/karzar-hesabfa-398-output \
            | redact

          echo "=== 10. COLLECT AND CHECK ARTIFACTS ==="
          ART="${GITHUB_WORKSPACE}/hesabfa-readonly-artifacts"
          rm -rf "$ART"
          mkdir -p "$ART"
          docker cp lathe_api:/tmp/karzar-hesabfa-398-output/. "$ART/"
          python3 - "$ART" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          art = Path(sys.argv[1])
          summary = json.loads((art / "summary.json").read_text(encoding="utf-8"))
          required = [
              "summary.json",
              "reconciliation.csv",
              "ambiguous.csv",
              "errors.csv",
              "sha256sums.txt",
          ]
          for name in required:
              if not (art / name).is_file():
                  raise SystemExit(f"missing artifact {name}")
          if int(summary.get("DATABASE_WRITES", -1)) != 0:
              raise SystemExit(f"DATABASE_WRITES={summary.get('DATABASE_WRITES')}")
          if int(summary.get("REMOTE_WRITES", -1)) != 0:
              raise SystemExit(f"REMOTE_WRITES={summary.get('REMOTE_WRITES')}")
          if summary.get("PAGINATION_COMPLETE") is not True:
              raise SystemExit(f"PAGINATION_COMPLETE={summary.get('PAGINATION_COMPLETE')}")
          reported = int(summary["HESABFA_REPORTED_TOTAL"])
          fetched = int(summary["HESABFA_ITEMS_FETCHED"])
          if reported != fetched:
              raise SystemExit(f"pagination {fetched} != {reported}")
          mode = str(summary.get("DATABASE_READ_ONLY", ""))
          if mode != "postgresql:transaction_read_only=on":
              raise SystemExit(f"DATABASE_READ_ONLY={mode}")
          if summary.get("SCAN_COMPLETE") is not True:
              raise SystemExit("SCAN_COMPLETE is not true")
          baseline = summary.get("CATALOG_BASELINE") or {}
          if int(baseline.get("TOTAL_NON_DELETED", -1)) != int(summary["TOTAL_SITE_NON_DELETED"]):
              raise SystemExit("TOTAL_NON_DELETED disagrees with summary population")
          if int(summary["TOTAL_SITE_NON_DELETED"]) != int(summary["SCANNED"]):
              raise SystemExit("SCANNED disagrees with TOTAL_SITE_NON_DELETED")
          blob = "\n".join(path.read_text(encoding="utf-8", errors="replace") for path in art.iterdir() if path.is_file())
          patterns = [
              r"api[_-]?key\s*[:=]",
              r"login[_-]?token\s*[:=]",
              r"authorization\s*:",
              r"bearer\s+[A-Za-z0-9\-._~+/]{8,}",
              r"password\s*[:=]",
              r"postgres(?:ql)?://\S+",
              r"\b09\d{9}\b",
              r"[A-Za-z0-9._%+\-]+@[A-Za-z0-9.\-]+\.[A-Za-z]{2,}",
          ]
          for pattern in patterns:
              if re.search(pattern, blob, flags=re.IGNORECASE):
                  raise SystemExit(f"artifact matched sensitive pattern {pattern}")
          print("ARTIFACT_SENSITIVE_SCAN=PASS")
          print(f"HESABFA_REPORTED_TOTAL={reported}")
          print(f"HESABFA_ITEMS_FETCHED={fetched}")
          print(f"HESABFA_PAGES_FETCHED={summary.get('HESABFA_PAGES_FETCHED')}")
          print(f"TOTAL_SITE_NON_DELETED={summary.get('TOTAL_SITE_NON_DELETED')}")
          print(f"MAPPED={summary.get('MAPPED')}")
          print(f"REMOTE_WRITES={summary.get('REMOTE_WRITES')}")
          print(f"DATABASE_WRITES={summary.get('DATABASE_WRITES')}")
          PY

          python3 - "$ART" "$HOSTNAME_NOW" "$APP_ENV" "${DATA_PLANE:-unset}" "$SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          art = Path(sys.argv[1])
          summary = json.loads((art / "summary.json").read_text(encoding="utf-8"))
          plane = sys.argv[4] or "unset"
          identity_lines = Path("/tmp/karzar-hesabfa-db-identity.txt").read_text(encoding="utf-8")
          alembic = ""
          for line in identity_lines.splitlines():
              if line.startswith("alembic="):
                  alembic = line.split("=", 1)[1]
          probe = {
              "host": sys.argv[2],
              "api_container": "lathe_api",
              "db_container": "lathe_postgres",
              "database": "karzar_staging",
              "volume": "karzar_postgres_data",
              "APP_ENV": sys.argv[3],
              "KARZAR_DATA_PLANE": plane,
              "identity_plane": "live" if plane in {"unset", "live"} else plane,
              "transaction_read_only": "on",
              "DATABASE_READ_ONLY": summary.get("DATABASE_READ_ONLY"),
              "DATABASE_WRITES": summary.get("DATABASE_WRITES"),
              "REMOTE_WRITES": summary.get("REMOTE_WRITES"),
              "alembic": alembic,
              "checkout_sha": sys.argv[5],
          }
          (art / "IDENTITY_PROBE.json").write_text(
              json.dumps(probe, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print("IDENTITY_PROBE=WRITTEN")
          PY

          LIVE_AFTER="$(stat -c '%Y' /opt/karzar/Karzar 2>/dev/null || echo 0)"
          [[ "$LIVE_BEFORE" == "$LIVE_AFTER" ]] || fail "live application tree mtime changed"
          echo "LIVE_TREE_MTIME_UNCHANGED=YES"
          echo "RECONCILE_READONLY_OK sha=${SHA}"

      - name: Upload sanitized artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hesabfa-activation-reconcile-readonly
          path: hesabfa-readonly-artifacts/
          if-no-files-found: error
          retention-days: 14
