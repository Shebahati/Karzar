name: Frontend CI

# Stable aggregators: storefront, admin-panel, storefront-e2e (classifier-skipped when not needed).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      risk_tier: ${{ steps.classify.outputs.risk_tier }}
      run_frontend_storefront: ${{ steps.classify.outputs.run_frontend_storefront }}
      run_frontend_admin: ${{ steps.classify.outputs.run_frontend_admin }}
      run_frontend_e2e: ${{ steps.classify.outputs.run_frontend_e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Classify
        id: classify
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python3 scripts/ci/classify_changes.py --force-full --github-output --step-summary
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            python3 scripts/ci/classify_changes.py --base "HEAD~1" --head HEAD --github-output --step-summary
          else
            python3 scripts/ci/classify_changes.py --base origin/main --head HEAD --pr-labels "$PR_LABELS" --github-output --step-summary
          fi

  storefront:
    name: storefront
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/Storefront
    steps:
      - uses: actions/checkout@v4

      - name: Skip (classifier)
        if: needs.classify.outputs.run_frontend_storefront != 'true'
        run: echo "Storefront checks not required (tier=${{ needs.classify.outputs.risk_tier }})."

      - uses: actions/setup-node@v4
        if: needs.classify.outputs.run_frontend_storefront == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/Storefront/package-lock.json

      - if: needs.classify.outputs.run_frontend_storefront == 'true'
        run: npm ci
      - if: needs.classify.outputs.run_frontend_storefront == 'true'
        run: npx tsc --noEmit
      - if: needs.classify.outputs.run_frontend_storefront == 'true'
        run: npm run lint
      - if: needs.classify.outputs.run_frontend_storefront == 'true'
        run: npm test

  admin-panel:
    name: admin-panel
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/admin-panel
    steps:
      - uses: actions/checkout@v4

      - name: Skip (classifier)
        if: needs.classify.outputs.run_frontend_admin != 'true'
        run: echo "Admin panel checks not required (tier=${{ needs.classify.outputs.risk_tier }})."

      - uses: actions/setup-node@v4
        if: needs.classify.outputs.run_frontend_admin == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/admin-panel/package-lock.json

      - if: needs.classify.outputs.run_frontend_admin == 'true'
        run: npm ci
      - if: needs.classify.outputs.run_frontend_admin == 'true'
        run: npx tsc --noEmit
      - if: needs.classify.outputs.run_frontend_admin == 'true'
        run: npm run lint
      - if: needs.classify.outputs.run_frontend_admin == 'true'
        run: npm test

  storefront-e2e:
    name: storefront-e2e
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend/Storefront
    steps:
      - uses: actions/checkout@v4

      - name: Skip (classifier)
        if: needs.classify.outputs.run_frontend_e2e != 'true'
        run: echo "Storefront e2e not required (tier=${{ needs.classify.outputs.risk_tier }})."

      - uses: actions/setup-node@v4
        if: needs.classify.outputs.run_frontend_e2e == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/Storefront/package-lock.json

      - if: needs.classify.outputs.run_frontend_e2e == 'true'
        run: npm ci
      - if: needs.classify.outputs.run_frontend_e2e == 'true'
        run: npx playwright install --with-deps chromium
      - if: needs.classify.outputs.run_frontend_e2e == 'true'
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_USE_MOCK: "true"
          CI: "true"
      - if: needs.classify.outputs.run_frontend_e2e == 'true'
        run: npm run test:http-contract
        env:
          CI: "true"
