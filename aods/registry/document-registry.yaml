# AODS Document Registry — active surface after documentation consolidation
meta:
  version: 1.1.1
  status: accepted
  notes: >
    Historical corpus lives under docs/archive/ and is excluded from authority scans.
    Branch membership is git (origin/main), not a registry on_main boolean.

