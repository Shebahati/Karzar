# Globs that are exempt from the "every markdown must be classified" rule.
# Keep this list SMALL — it is the escape hatch that lets the corpus decay.
unclassified_allow:
  - "**/node_modules/**"
  - ".git/**"
  - "aods/reports/**"
  - ".github/*.md"                               # GitHub PR/issue templates (CR-018)
  - "frontend/Storefront/content/**/README.md"   # per-directory data notes
  - "data/imports/**/README.md"                  # per-import provenance notes
  - "scripts/brand_logo_assets/README.md"
  - "deploy/staging/frontend/README.md"
  - "project-management/diagrams/README.md"
  - "project-management/printable/README.md"
  - "project-management/_templates/**"
  - "docs/audits/**"                             # bulk EVIDENCE; represented by summary rows below
  - "project-management/progress/**"             # canonical progress ledgers (CR-007 Option A)
  - "project-management/sprints/**"              # canonical sprint files (CR-007 Option A)
  - "frontend/docs/**"                           # bilingual audit/gap twins; EVIDENCE, superseded by v2
  - "aods/70-prompts/*/*.prompt.md"              # validated by --gate prompts instead

