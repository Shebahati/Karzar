# AODS Document Registry
# ---------------------------------------------------------------------------
# Machine-readable twin of aods/10-repository-intelligence/AUTHORITY-MODEL.md
#
# PURPOSE
#   Every governance-relevant document in the repository is classified here.
#   `aods/tools/aods_validate.py --gate registry` fails when:
#     * a markdown file exists that is neither registered nor matched by `unclassified_allow`
#     * a registered `path` does not exist AND `on_main` is not explicitly false
#     * a prompt declares context that includes a `forbidden_context: true` document
#
# CLASSES (see AUTHORITY-MODEL.md §2)
#   CANON | PROPOSED | CONTRACT | POLICY | PLAN | EVIDENCE | GENERATED
#   REFERENCE | HISTORICAL | QUARANTINED
#
# RANK (see AUTHORITY-MODEL.md §3) — lower number wins a conflict.
#
# EDITING RULES
#   * Adding a CANON row requires an Architecture Board minute (HC-03).
#   * Changing `class` or `rank` requires the decision authority for that rank.
#   * `notes` should carry the CR-nnn conflict ID when a row is disputed.
# ---------------------------------------------------------------------------

