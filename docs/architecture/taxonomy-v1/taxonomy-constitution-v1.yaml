    definition: "Broad long-lived engineering pillar"
    product_direct_assignment: false
    hierarchical: true
    multi_value: false
    stable_id_prefix: "KZ.DOM"
    seo_hub_default: false
  family:
    definition: "Ontological neighborhood under a Domain; nestable"
    product_direct_assignment: false
    hierarchical: true
    multi_value: false
    stable_id_prefix: "KZ.FAM"
    seo_hub_default: false
  knowledge_category:
    mandatory: false
    steward_status: APPROVED
    amendment: >
      STEWARD-APPROVED — Knowledge Category is NOT a mandatory hierarchy level.
      Target: Domain → Family (optional nested Family) → Product Type.
      Domain → Family → Knowledge Category → Product Type must NOT be required.
      MAY remain as optional organizational concept if a future use case requires it.
    prefer: "Domain → Family(nestable) → Product Type"
  product_type:
    definition: "Engineering identity — what the product fundamentally IS"
    product_direct_assignment: "0..1 primary"
    hierarchical: false
    multi_value: false
    stable_id_prefix: "KZ.PT"
    legacy_codes_grandfathered: true
    seo_hub_default: false
    owns: ["product_type_definitions", "attribute_memberships"]
  commerce_category:
    definition: "Buyer-facing merchandising and SEO hub node"
    product_direct_assignment: true
    hierarchical: true
    max_depth: 3
    selectable_leaf_depths: [2, 3]
    multi_value: false
    stable_id_prefix: "KZ.CAT"
    stable_id_status: MISSING_IN_PRODUCTION
    seo_hub_default: true
    must_not_be: "engineering_source_of_truth"
  property_definition:
    stable_id: ["definition_id", "key"]
    product_direct_assignment: "via facts"
  property_value:
    storage: "facts or enum members"
  application:
    stable_id_prefix: "KZ.APP"
    multi_value: true
    product_direct_assignment: "secondary"
  industry:
    stable_id_prefix: "KZ.IND"
    multi_value: true
  technical_classification:
    stable_id_prefix: "KZ.TECH"
    prefer_property_when: "reducible to property=value"
  brand:
    table: brands
    must_not_be: ["domain", "family", "product_type"]
  synonym:
    has_own_stable_id: false
    attached_to: "parent_concept"
  trade_name:
    never_default_product_type_name: true
  megamenu_group:
    presentation_only: true
    ontology_authority: false

relationships_preferred_over_taxonomy:
