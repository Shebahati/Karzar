  - COMPATIBLE_WITH
  - REQUIRES
  - REPLACEMENT_FOR
  - SUCCESSOR_OF
  - CONSUMABLE_FOR
  - PART_OF

product_type_split_test:
  id: PTST-1
  order: [Q1, Q2, Q3, Q4, Q5, Q6, Q7, Q8, Q9, Q10]
  merely_is_normative: true
  questions:
    Q1: "Fundamentally different engineering functions?"
    Q2: "Fundamentally different physical or measurement principles?"
    Q3: "Materially different required property schema?"
    Q4: "Geometry defines identity (not mere size)?"
    Q5: "Authoritative standard treats as different classes?"
    Q6: "Combining makes required properties meaningless/highly conditional?"
    Q7: "Merely a value of an existing property? (merely is normative)"
    Q8: "Merely application/context? (merely is normative)"
    Q9: "Merely interface/compatibility without holding-principle change? (merely is normative)"
    Q10: "Merely marketing/brand/series/trade vocabulary? (merely is normative)"
  guard: >
    Q7–Q10 are terminal SAME_PRODUCT_TYPE rules only where the distinction
    is merely that dimension and does not independently satisfy the
    identity-changing conditions in Q1–Q6. Syntactic expressibility as
    property=value does NOT automatically force SAME_PRODUCT_TYPE.
    Example: end_geometry=ball_nose does NOT prove Square End Mill =
    Ball Nose End Mill when geometry defines engagement identity,
    working geometry, required schema, or engineering function.
  anti_misapplication: >
    Never short-circuit to Q7–Q10 before evaluating whether Q1–Q6 already
    establish a material identity change.
  decision_rule: |
    IF (Q7 OR Q8 OR Q10)
       AND distinction does NOT independently satisfy Q1–Q6 identity-changing conditions
       THEN SAME_PRODUCT_TYPE
    ELSE IF Q9 AND NOT (Q1 OR Q2 OR Q3 OR Q4) THEN SAME_PRODUCT_TYPE
    ELSE IF (Q1 OR Q2) AND (Q3 OR Q6) THEN NEW_PRODUCT_TYPE
    ELSE IF Q5 AND (Q3 OR Q4 OR Q6) THEN NEW_PRODUCT_TYPE
    ELSE IF Q4 AND Q3 THEN NEW_PRODUCT_TYPE
    ELSE IF any(Q1..Q6) with thin evidence THEN NEEDS_DOMAIN_REVIEW
    ELSE SAME_PRODUCT_TYPE
  results: [SAME_PRODUCT_TYPE, NEW_PRODUCT_TYPE, NEEDS_DOMAIN_REVIEW]

