stable_identity:
  model: hybrid_wave_1
  layers:
    internal_db_surrogate: "categories.id / product_types.id — runtime only; never semantic import key"
    published_code: "KZ.CAT.* / KZ.PT.* — immutable published semantic identity after publication; never reused"
    opaque_uuid_ulid: "FUTURE OPTIONAL enhancement — NOT required before Phase 1B or initial Commerce migration"
    labels: mutable
    slug: "mutable with redirect; not identity"
    parent_path: "mutable; not identity"
  namespaces:
    domain: "KZ.DOM.*"
    family: "KZ.FAM.*"
    product_type: "KZ.PT.* (legacy codes grandfathered)"
    commerce_category: "KZ.CAT.*"
    application: "KZ.APP.*"
    industry: "KZ.IND.*"
    technical: "KZ.TECH.*"
  commerce_category_code_status: SCHEMA_EXTENSION_REQUIRED
  commerce_sequencing_steward_approved:
    - "Phase 1B: Design KZ.CAT.* for all live target categories"
    - "Freeze Current → Target mapping manifest"
    - "Later schema: categories.code nullable + UNIQUE"
    - "Backfill codes"
    - "Validate completeness / uniqueness"
    - "Make code mandatory for active categories"
    - "Refactor importers: semantic code → runtime DB id"
    - "CI forbids new bare numeric category semantic dependencies"
  do_not_implement_schema_in_phase_1a: true

